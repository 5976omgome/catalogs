<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catalog Audit</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">[ </span>
      <span class="brand-name">CATALOG_AUDIT</span>
      <span class="brand-mark"> ]</span>
      <span class="brand-version">v3.0 P-LINE</span>
    </div>
    <div class="status-pills">
      <span class="pill" id="itunes-pill">apple p-line: ok</span>
      <span class="pill" id="ai-pill">ai: --</span>
      <span class="pill" id="discogs-pill">discogs: --</span>
      <span class="pill" id="run-pill">idle</span>
    </div>
  </header>

  <main class="grid">

    <section class="card">
      <h2>QUEUE</h2>
      <div id="dropzone" class="dropzone">
        <input type="file" id="file-input" accept=".csv" multiple hidden />
        <p class="dz-main">drop chartmetric .csv files here</p>
        <p class="dz-sub">or <button class="link-btn" id="browse-btn">browse</button></p>
      </div>
      <ul id="queue" class="queue"></ul>
      <div class="row gap">
        <button id="run-btn" class="btn btn-primary">RUN QUEUE</button>
        <button id="clear-btn" class="btn">clear finished</button>
        <button id="open-output-btn" class="btn">open outputs folder</button>
      </div>
    </section>

    <section class="card">
      <h2>PROGRESS</h2>
      <div class="progress-row">
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-pct" class="progress-pct">0%</span>
      </div>
      <p id="progress-line" class="muted">waiting for files...</p>
      <div class="counters">
        <div class="counter">
          <span class="ck">CLEAN</span><span id="ct-clean">0</span>
        </div>
        <div class="counter">
          <span class="cr">FLAGGED</span><span id="ct-flagged">0</span>
        </div>
        <div class="counter">
          <span class="cm">RATIO</span><span id="ct-ratio">0/0</span>
        </div>
      </div>
    </section>

    <section class="card span-2">
      <div class="card-head">
        <h2>LIVE_OUTPUT</h2>
        <label class="toggle">
          <input type="checkbox" id="filter-flagged-only" />
          <span>show only flagged</span>
        </label>
      </div>
      <pre id="log" class="log"></pre>
    </section>

  </main>

  <footer class="footer">
    <span id="output-dir">outputs:</span>
    <button id="cache-clear-btn" class="link-btn small">clear cache</button>
  </footer>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IGNITE: Genitractor</title>
  <link rel="stylesheet" href="genitractor.css">
</head>
<body>
  <!-- STICKY TOP BAR -->
  <header class="topbar">
    <div class="brand-group">
      <img src="logos/ignite.svg" alt="IGNITE" class="brand-logo">
      <div class="brand-text">
        <div class="brand">VIRTUAL SCOUT</div>
        <div class="brand-sub">CONTACT EXTRACTION</div>
      </div>
      <span class="clock" id="clock">00:00:00</span>
    </div>
    <div class="pills">
      <span class="pill clickable" id="pill-genius" data-key="genius_token">GENIUS</span>
      <span class="pill-divider"></span>
      <div class="tools-dropdown" id="tools-dropdown">
        <button class="btn-tools" id="tool-btn">GENITRACTOR</button>
        <div class="tools-menu" id="tools-menu">
          <a href="/" class="tool-option tool-chartporter-opt">Chartporter</a>
          <a href="/genitractor" class="tool-option tool-genitractor-opt active">Genitractor</a>
        </div>
      </div>
      <button class="btn-feedback" id="btn-feedback">FEEDBACK</button>
    </div>
  </header>

  <!-- STICKY QUEUE BAR -->
  <nav class="queue-bar">
    <div class="queue-row">
      <label class="filebtn"><input type="file" id="file-input" accept=".csv,.tsv" multiple><span>ADD</span></label>
      <button id="btn-run" class="primary">RUN</button>
      <button id="btn-stop" class="warn">STOP</button>
      <button id="btn-export-all" class="ghost">EXPORT</button>
      <span class="pill-divider"></span>
      <span class="timer" id="timer">00:00</span>
      <span class="stat-pct" id="stat-pct">0%</span>
    </div>
    <ul id="queue" class="queue"></ul>
  </nav>

  <!-- SCROLLABLE CONTENT -->
  <main>
    <section class="card collapsible" id="card-system">
      <header class="card-head" data-collapse="sys-body">
        <h2>SYSTEM</h2>
        <button class="ghost collapse-btn">&#9660;</button>
      </header>
      <div class="sys-log-wrap" id="sys-body">
        <div id="sys-log"></div>
      </div>
    </section>

    <section class="card grow collapsible" id="card-feeds">
      <header class="card-head" data-collapse="feeds-body">
        <h2>FEED</h2>
        <button class="ghost collapse-btn">&#9660;</button>
      </header>
      <div id="feeds-body">
        <div id="feeds-grid" class="feeds-grid"></div>
      </div>
    </section>
  </main>

  <footer class="powered-footer">
    <div class="footer-inner">
      <div class="footer-label">POWERED BY</div>
      <div class="footer-logos">
        <a href="https://docs.genius.com/" target="_blank" rel="noopener" class="logo-link" title="Genius API"><img src="logos/genius.svg" alt="Genius" height="20"></a>
      </div>
      <div class="footer-credit">IGNITE THE LABEL &middot; Q2 2026</div>
    </div>
  </footer>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal modal-sm">
      <div class="modal-head">
        <h2 id="confirm-title">Confirm</h2>
        <button class="ghost modal-close" id="confirm-close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="confirm-msg" class="confirm-msg">Are you sure?</p>
        <div class="confirm-actions">
          <button class="primary" id="confirm-yes">YES</button>
          <button class="ghost" id="confirm-no">NO</button>
        </div>
      </div>
    </div>
  </div>

  <!-- API Key Modal -->
  <div class="modal-overlay" id="key-modal">
    <div class="modal modal-sm">
      <div class="modal-head">
        <h2 id="key-modal-title">Set Genius Token</h2>
        <button class="ghost modal-close" id="key-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <input type="password" class="key-modal-input" id="key-modal-input" placeholder="Paste Genius token here...">
        <div class="keys-actions">
          <button id="key-modal-save" class="primary">SAVE</button>
          <span id="key-modal-msg"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div class="modal-overlay" id="feedback-modal">
    <div class="modal">
      <div class="modal-head">
        <h2>Submit Feedback</h2>
        <button class="ghost modal-close" id="feedback-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="fb-field">
          <label class="fb-label">Category</label>
          <div class="fb-cats">
            <button class="fb-cat" data-cat="BUG">BUG</button>
            <button class="fb-cat" data-cat="IDEA">IDEA</button>
            <button class="fb-cat" data-cat="OTHER">OTHER</button>
          </div>
        </div>
        <div class="fb-field">
          <label class="fb-label">Your Feedback</label>
          <textarea class="fb-textarea" id="fb-text" placeholder="Describe the bug, idea, or note..." rows="4"></textarea>
        </div>
        <div class="fb-actions">
          <button class="primary fb-submit" id="fb-submit" disabled>SUBMIT</button>
          <span class="fb-submit-status" id="fb-submit-status"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Cross-Tool Progress Bar (shows Chartporter progress) -->
  <div class="cross-tool-bar" id="cross-tool-bar">
    <span class="ctb-icon chartporter"></span>
    <span class="ctb-label">CHARTPORTER</span>
    <div class="ctb-progress"><span class="chartporter" id="ctb-fill" style="width:0%"></span></div>
    <span class="ctb-stats" id="ctb-stats">0/0</span>
    <span class="ctb-timer" id="ctb-timer">00:00</span>
    <a href="/" class="ctb-btn chartporter">OPEN</a>
  </div>

  <script src="genitractor.js"></script>
</body>
</html>

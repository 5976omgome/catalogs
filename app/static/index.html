<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IGNITE: VIRTUAL SCOUT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-group">
      <img src="logos/ignite.svg" alt="IGNITE" class="brand-logo">
      <div class="brand-text">
        <div class="brand">VIRTUAL SCOUT</div>
        <div class="brand-sub">CATALOG INTELLIGENCE</div>
      </div>
    </div>
    <div class="pills">
      <span class="pill ok" id="pill-itunes">ITUNES</span>
      <span class="pill ok" id="pill-deezer">DEEZER</span>
      <span class="pill" id="pill-groq">GROQ</span>
      <span class="pill" id="pill-gemini">GEMINI</span>
      <span class="pill" id="pill-genius">GENIUS</span>
      <span class="pill-divider"></span>
      <button class="btn-feedback" id="btn-feedback">FEEDBACK</button>
    </div>
  </header>

  <main>
    <section class="card collapsible" id="card-keys">
      <header class="card-head" data-collapse="keys-body">
        <h2>API</h2>
        <button class="ghost collapse-btn">&#9660;</button>
      </header>
      <div class="card-body" id="keys-body">
        <div class="keys-grid">
          <label><span>GROQ</span><input id="key-groq" type="password" placeholder="paste key"><small id="prev-groq"></small></label>
          <label><span>GEMINI</span><input id="key-gemini" type="password" placeholder="paste key"><small id="prev-gemini"></small></label>
          <label><span>GENIUS</span><input id="key-genius" type="password" placeholder="paste token"><small id="prev-genius"></small></label>
        </div>
        <div class="keys-actions">
          <button id="btn-save-keys" class="primary">SAVE</button>
          <button id="btn-clear-keys" class="ghost">CLEAR</button>
          <span id="keys-msg"></span>
        </div>
      </div>
    </section>

    <section class="card collapsible" id="card-queue">
      <header class="card-head" data-collapse="queue-body">
        <h2>QUEUE</h2>
        <div class="row">
          <label class="filebtn"><input type="file" id="file-input" accept=".csv,.tsv" multiple><span>+ CSV</span></label>
          <button id="btn-run" class="primary">RUN</button>
          <button id="btn-stop" class="warn">STOP</button>
          <button id="btn-export-all" class="ghost">EXPORT</button>
          <button id="btn-clear" class="ghost">CLEAR</button>
        </div>
        <button class="ghost collapse-btn">&#9660;</button>
      </header>
      <div class="card-body" id="queue-body">
        <ul id="queue" class="queue"></ul>
      </div>
    </section>

    <section class="card" id="card-system">
      <header class="card-head">
        <h2>SYSTEM</h2>
      </header>
      <div class="sys-log-wrap" id="sys-log"></div>
    </section>

    <section class="card grow" id="card-feeds">
      <header class="card-head">
        <h2 id="feeds-title">FEED</h2>
        <div class="row" id="global-filters">
          <span class="ftoggle f-drop on" id="gf-drop">FLAGGED</span>
          <span class="ftoggle f-review on" id="gf-review">REVIEW</span>
          <span class="ftoggle f-keep on" id="gf-keep">CLEAN</span>
          <span class="ftoggle f-socials on" id="gf-socials">SOCIALS</span>
          <span class="ftoggle f-debug off" id="gf-debug">DEBUG</span>
        </div>
      </header>
      <div id="feeds-grid" class="feeds-grid"></div>
    </section>
  </main>

  <footer class="powered-footer">
    <div class="footer-inner">
      <div class="footer-label">POWERED BY</div>
      <div class="footer-logos">
        <a href="https://kiro.dev/" target="_blank" rel="noopener" class="logo-link" title="Kiro — AI IDE">
          <img src="logos/kiro.svg" alt="Kiro" height="22">
        </a>
        <span class="footer-dot"></span>
        <a href="https://chartmetric.com/features/developer-api" target="_blank" rel="noopener" class="logo-link" title="Chartmetric API">
          <img src="logos/chartmetric.svg" alt="Chartmetric" height="20">
        </a>
        <span class="footer-dot"></span>
        <a href="https://performance-partners.apple.com/search-api" target="_blank" rel="noopener" class="logo-link" title="iTunes Search API">
          <img src="logos/itunes.svg" alt="iTunes" height="22">
        </a>
        <span class="footer-dot"></span>
        <a href="https://developers.deezer.com/api" target="_blank" rel="noopener" class="logo-link" title="Deezer API">
          <img src="logos/deezer.svg" alt="Deezer" height="20">
        </a>
        <span class="footer-dot"></span>
        <a href="https://docs.genius.com/" target="_blank" rel="noopener" class="logo-link" title="Genius API">
          <img src="logos/genius.svg" alt="Genius" height="18">
        </a>
      </div>
      <div class="footer-credit">IGNITE THE LABEL &middot; Q2 2026</div>
    </div>
  </footer>

  <!-- Feedback Modal -->
  <div class="modal-overlay" id="feedback-modal">
    <div class="modal">
      <div class="modal-head">
        <h2>Submit Feedback</h2>
        <button class="ghost modal-close" id="feedback-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="fb-field">
          <label class="fb-label">Category</label>
          <div class="fb-cats">
            <button class="fb-cat" data-cat="BUG">BUG</button>
            <button class="fb-cat" data-cat="IDEA">IDEA</button>
            <button class="fb-cat" data-cat="OTHER">OTHER</button>
          </div>
        </div>
        <div class="fb-field">
          <label class="fb-label">Your Feedback</label>
          <textarea class="fb-textarea" id="fb-text" placeholder="Describe the bug, idea, or note..." rows="4"></textarea>
        </div>
        <div class="fb-ai-row">
          <button class="ghost fb-ai-btn" id="fb-ai-clean" disabled>&#10024; CLEAN UP WITH GROQ</button>
          <span class="fb-ai-status" id="fb-ai-status"></span>
        </div>
        <div class="fb-preview-wrap" id="fb-preview-wrap" style="display:none">
          <label class="fb-label">AI-Enhanced Preview</label>
          <div class="fb-preview" id="fb-preview"></div>
        </div>
        <div class="fb-actions">
          <button class="primary fb-submit" id="fb-submit" disabled>SUBMIT TO REPO</button>
          <span class="fb-submit-status" id="fb-submit-status"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

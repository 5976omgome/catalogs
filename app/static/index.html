<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog Audit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">CATALOG AUDIT</div>
    <div class="pills">
      <span class="pill" id="pill-itunes">iTunes</span>
      <span class="pill" id="pill-deezer">Deezer</span>
      <span class="pill" id="pill-ai">ai</span>
    </div>
  </header>

  <main>
    <section class="card" id="card-keys">
      <header class="card-head">
        <h2>API Keys</h2>
        <button id="btn-toggle-keys" class="ghost">edit</button>
      </header>
      <div class="keys-body" id="keys-body" style="display:none">
        <div class="keys-grid two-col">
          <label>
            <span>Groq</span>
            <input id="key-groq" type="password" placeholder="paste key">
            <small id="prev-groq"></small>
          </label>
          <label>
            <span>Gemini</span>
            <input id="key-gemini" type="password" placeholder="paste key">
            <small id="prev-gemini"></small>
          </label>
          <label>
            <span>Genius</span>
            <input id="key-genius" type="password" placeholder="paste token">
            <small id="prev-genius"></small>
          </label>
        </div>
        <div class="keys-actions">
          <button id="btn-save-keys" class="primary">SAVE</button>
          <button id="btn-clear-keys" class="ghost">clear all</button>
          <span id="keys-msg"></span>
        </div>
      </div>
    </section>

    <section class="card">
      <header class="card-head">
        <h2>Queue</h2>
        <div class="row">
          <label class="filebtn">
            <input type="file" id="file-input" accept=".csv,.tsv" multiple>
            <span>+ CSV</span>
          </label>
          <button id="btn-run" class="primary">RUN ALL</button>
          <button id="btn-stop" class="warn">STOP ALL</button>
          <button id="btn-export-all" class="ghost">EXPORT ALL</button>
          <button id="btn-clear" class="ghost">clear done</button>
        </div>
      </header>
      <ul id="queue" class="queue"></ul>
    </section>

    <section class="card grow" id="feeds-section">
      <header class="card-head">
        <h2>Live Feeds</h2>
        <span class="counter" id="counter-global"></span>
      </header>
      <div id="feeds-grid" class="feeds-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
